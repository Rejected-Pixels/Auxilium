name: Release

# Builds a versioned jar artifact (<mod_name>-<minecraft_version>-<version>.jar) and tags it when:
#   - a pull request is merged into main (version from its Conventional Commits)
#   - a v* tag is pushed, on any branch (version from the tag)
#   - the workflow is run manually
# Anything released from outside main must be an alpha or beta pre-release. See .github/scripts/resolve-version.sh.
on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'auto = full release on main, alpha on other branches. "release" is only allowed on main.'
        type: choice
        options: [auto, alpha, beta, release]
        default: auto
      version:
        description: 'Optional exact version, SemVer 2.0 without the leading v (e.g. 1.2.0 or 1.2.0-beta.1). Overrides channel. Outside main it must be -alpha or -beta.'
        required: false
        default: ''

# One release at a time across the whole repo, so two runs can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # A closed pull request only matters if it was merged.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # For a merged PR, use the merge commit that landed on main.
          ref: ${{ github.event.pull_request.merge_commit_sha || '' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Record commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/resolve-version.sh

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      version: ${{ needs.version.outputs.version }}
      upload: true

  tag:
    needs: [version, build]
    if: needs.version.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Tag release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
