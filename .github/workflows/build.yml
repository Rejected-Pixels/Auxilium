name: Build

on:
  push:
    branches: ['**']
  pull_request:

# One run at a time per branch/PR, so two pushes to main can't both claim the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the vX.Y.Z release tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Work out version
        id: version
        run: |
          bash .github/scripts/next-version.sh > "$RUNNER_TEMP/version.env"
          cat "$RUNNER_TEMP/version.env" >> "$GITHUB_OUTPUT"
          source "$RUNNER_TEMP/version.env"

          release=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="$dev_base-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "$bump" != "none" ]]; then
            version="$next_version"
            release=true
          else
            version="$dev_base-dev.${{ github.run_number }}"
          fi

          # Full SemVer 2.0 check (https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string).
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a valid SemVer 2.0 version"
            exit 1
          fi

          mod_name=$(grep -E '^mod_name=' gradle.properties | cut -d= -f2-)
          minecraft_version=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2-)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "jar_name=$mod_name-$minecraft_version-$version" >> "$GITHUB_OUTPUT"
          echo "### $mod_name $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Bump since v$last_version: **$bump** · release: **$release**" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.jar_name }}
          path: build/libs/${{ steps.version.outputs.jar_name }}.jar
          if-no-files-found: error

      - name: Tag release
        if: steps.version.outputs.release == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
