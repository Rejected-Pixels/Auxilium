name: Build

# Reusable build, called by ci.yml and release.yml.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the triggering commit).
        type: string
        default: ''
      version:
        description: SemVer version to build with. Empty uses mod_version from gradle.properties.
        type: string
        default: ''
      upload:
        description: Upload the jar as a workflow artifact.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        # v5 is the newest release without the separately licensed caching component that v6 introduced.
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        env:
          VERSION: ${{ inputs.version }}
        run: ./gradlew build ${VERSION:+-Pmod_version=$VERSION}

      - name: Work out jar name
        if: inputs.upload
        id: jar
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mod_name=$(grep -E '^mod_name=' gradle.properties | cut -d= -f2-)
          minecraft_version=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2-)
          echo "name=$mod_name-$minecraft_version-$VERSION" >> "$GITHUB_OUTPUT"

      # archive: false (v7+) uploads the jar itself instead of a zip; the artifact is named after the file.
      - name: Upload jar
        if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/${{ steps.jar.outputs.name }}.jar
          archive: false
          if-no-files-found: error
