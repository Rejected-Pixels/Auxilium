name: Build

# Releases (versioned jar artifact + vX.Y.Z tag) only happen when:
#   - a pull request is merged into main (version worked out from its Conventional Commits)
#   - a v* tag is pushed, on any branch (version taken from the tag)
#   - the workflow is run manually (main: next version; other branches: a pre-release), optionally with an explicit version
# Every other push and pull request update just builds, to check it compiles.
#
# Anything released from outside main must be an alpha or beta pre-release (X.Y.Z-alpha.N / X.Y.Z-beta.N),
# which also ends up in the jar name, e.g. Auxilium-1.21.1-0.2.0-beta.1.jar.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      channel:
        description: 'auto = full release on main, alpha on other branches. "release" is only allowed on main.'
        type: choice
        options: [auto, alpha, beta, release]
        default: auto
      version:
        description: 'Optional exact version, SemVer 2.0 without the leading v (e.g. 1.2.0 or 1.2.0-beta.1). Overrides channel. Outside main it must be -alpha or -beta.'
        required: false
        default: ''

# One run at a time per branch/PR/tag, so two runs can't claim the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the release tag

jobs:
  build:
    # A closed pull request only matters if it was merged.
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # For a merged PR, build the merge commit that landed on main.
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || '' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Work out version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          bash .github/scripts/next-version.sh > "$RUNNER_TEMP/version.env"
          source "$RUNNER_TEMP/version.env"

          # release: build + upload the jar. create_tag: also tag the commit (not needed when the run came from a tag).
          release=false
          create_tag=false

          # Whether the commit being built is already part of main; anything else may only be released as alpha/beta.
          on_main=false
          if git rev-parse -q --verify refs/remotes/origin/main > /dev/null && git merge-base --is-ancestor HEAD origin/main; then
            on_main=true
          fi
          is_alpha_or_beta() { [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)([.+]|$) ]]; }
          require_prerelease_off_main() {
            if [[ "$on_main" != "true" ]] && ! is_alpha_or_beta "$1"; then
              echo "::error::'$1' is being released from outside main, so it must be an alpha or beta pre-release (e.g. $dev_base-alpha.1)"
              exit 1
            fi
          }
          # Next X.Y.Z-<channel>.N, counting up from any existing tags for that version and channel.
          next_prerelease() {
            local base="$1" channel="$2" last
            last=$(git tag --list "v$base-$channel.*" | sed -nE "s/^v${base//./\\.}-$channel\.(0|[1-9][0-9]*)$/\1/p" | sort -n | tail -n 1)
            echo "$base-$channel.$(( ${last:-0} + 1 ))"
          }

          if [[ "$EVENT" == "pull_request" && "$PR_ACTION" == "closed" ]]; then
            if [[ "$PR_BASE" == "main" && "$bump" != "none" ]]; then
              version="$next_version"; release=true; create_tag=true
            else
              # Merged into another branch, or only chore/docs/ci-style commits: nothing to release.
              version="$dev_base-dev.$RUN_NUMBER"
            fi
          elif [[ "$EVENT" == "push" && "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"; release=true
            require_prerelease_off_main "$version"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            release=true; create_tag=true
            channel="${INPUT_CHANNEL:-auto}"
            if [[ "$channel" == "auto" ]]; then
              [[ "$on_main" == "true" ]] && channel=release || channel=alpha
            fi

            if [[ -n "$INPUT_VERSION" ]]; then
              version="${INPUT_VERSION#v}"
              require_prerelease_off_main "$version"
            elif [[ "$channel" == "release" ]]; then
              if [[ "$on_main" != "true" ]]; then
                echo "::error::Full releases can only be made from main. Pick the alpha or beta channel for $REF_NAME."
                exit 1
              fi
              if [[ "$bump" == "none" ]]; then
                echo "::error::No feat/fix/perf or breaking commits since v$last_version, so there is nothing to release. Enter a version to release anyway."
                exit 1
              fi
              version="$next_version"
            else
              # alpha / beta, e.g. 0.2.0-alpha.1, then 0.2.0-alpha.2, then 0.2.0-beta.1.
              version=$(next_prerelease "$dev_base" "$channel")
            fi
          elif [[ "$EVENT" == "pull_request" ]]; then
            version="$dev_base-pr.$PR_NUMBER.$RUN_NUMBER"
          else
            version="$dev_base-dev.$RUN_NUMBER"
          fi

          # Full SemVer 2.0 check (https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string).
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a valid SemVer 2.0 version"
            exit 1
          fi
          if [[ "$create_tag" == "true" ]] && git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          mod_name=$(grep -E '^mod_name=' gradle.properties | cut -d= -f2-)
          minecraft_version=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2-)

          {
            echo "version=$version"
            echo "release=$release"
            echo "create_tag=$create_tag"
            echo "jar_name=$mod_name-$minecraft_version-$version"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $mod_name $version"
            echo "Bump since v$last_version: **$bump** · release: **$release** · tag: **$create_tag**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Upload jar
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.jar_name }}
          path: build/libs/${{ steps.version.outputs.jar_name }}.jar
          if-no-files-found: error

      - name: Tag release
        if: steps.version.outputs.create_tag == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
