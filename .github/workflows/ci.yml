name: CI

# Checks that every push and pull request builds. No artifact, no version, no tag.
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push to the same branch/PR makes an in-progress check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
