name: CI

# Checks that main builds, plus on-demand builds of any branch. No artifact, version or tag.
# Tag pushes and manual releases are built by release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main makes an in-progress check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
